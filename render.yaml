# Render blueprint for the email_assistant FastAPI backend.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# The frontend is deployed separately to Vercel.
services:
  - type: web
    name: email-assistant-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FAKE_LLM
        value: "0"
      - key: ROUTING_PROFILE
        value: quality
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Set to your Vercel frontend URL after it deploys, e.g.
      # https://email-assistant.vercel.app
      - key: CORS_ORIGINS
        sync: false
