server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA has one entry point; any unknown path is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE needs all three: no response buffering, no gzip re-chunking, and
        # a read timeout longer than a generation run. Without them the stream
        # arrives in one lump at the end, or is cut off mid-run.
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }
}
